<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register as Travel Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Travel Agency Registration</h4>
                    </div>
                    <div class="card-body">
                        <form action="{{ url_for('register_agency') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Agency / Company Name</label>
                                <input type="text" name="company_name" class="form-control" placeholder="e.g. Royal Travels" required>
                                <small class="text-muted">This name will be displayed on your bus tickets.</small>
                            </div>
                            <hr>
                            <h5>Admin Account Details</h5>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="admin@agency.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Register Agency</button>
                                <a href="{{ url_for('login') }}" class="btn btn-link">Already have an account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
